name: Deploy HotelApp to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotelapp-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookbox_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: hookbox_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hookbox_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hookbox_test:local-ci-only@127.0.0.1:5432/hookbox_ci
      HOOKBOX_TEST_DATABASE_URL: postgresql://hookbox_test:local-ci-only@127.0.0.1:5432/hookbox_ci
      OTA_POSTGRES_TEST_DATABASE_URL: postgresql://hookbox_test:local-ci-only@127.0.0.1:5432/hookbox_ci
      CHECKOUT_POSTGRES_TEST_DATABASE_URL: postgresql://hookbox_test:local-ci-only@127.0.0.1:5432/hookbox_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate isolated test database
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://hotelapp:dummy@localhost:5432/hotelapp
        run: npx prisma validate

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Install provisioning secret without logging it
        env:
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          set -euo pipefail
          if [[ ! "$PROVISIONING_MASTER_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::PROVISIONING_MASTER_KEY must be a configured 32-byte hexadecimal repository secret."
            exit 1
          fi
          printf '%s\n' "$PROVISIONING_MASTER_KEY" | ssh "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            umask 077
            IFS= read -r provisioning_key
            invalid_chars="$(printf "%s" "$provisioning_key" | tr -d "0-9a-fA-F")"
            if [ "${#provisioning_key}" -ne 64 ] || [ -n "$invalid_chars" ]; then
              echo "Invalid provisioning secret received" >&2
              exit 1
            fi
            cd /opt/hotelapp
            test -f .env
            env_tmp="$(mktemp .env.provisioning.XXXXXX)"
            trap '\''rm -f "$env_tmp"'\'' EXIT
            found=false
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                PROVISIONING_MASTER_KEY=*)
                  printf "PROVISIONING_MASTER_KEY=%s\n" "$provisioning_key" >> "$env_tmp"
                  found=true
                  ;;
                *) printf "%s\n" "$line" >> "$env_tmp" ;;
              esac
            done < .env
            if [ "$found" = false ]; then
              printf "PROVISIONING_MASTER_KEY=%s\n" "$provisioning_key" >> "$env_tmp"
            fi
            chown --reference=.env "$env_tmp"
            chmod --reference=.env "$env_tmp"
            mv -f "$env_tmp" .env
            trap - EXIT
            unset provisioning_key
            echo "Provisioning secret installed in the protected server environment"
          '

      - name: Deploy exact commit
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
            set -euo pipefail
            cd /opt/hotelapp

            git fetch --prune origin main
            PREVIOUS_VERSION_JSON="$(curl --fail --silent --show-error http://127.0.0.1:3001/api/version)"
            PREVIOUS_SHA="$(printf '%s' "$PREVIOUS_VERSION_JSON" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p')"
            if [ -z "$PREVIOUS_SHA" ] || ! git cat-file -e "$PREVIOUS_SHA^{commit}"; then
              echo "::error::Cannot identify the currently deployed commit for a safe rollback"
              exit 1
            fi
            # The production Compose file has site-specific local overrides.
            # Preserve only that tracked modification; refuse every other dirty file.
            LOCAL_CHANGED="$(git diff --name-only)"
            LOCAL_STAGED="$(git diff --cached --name-only)"
            if [ -n "$LOCAL_STAGED" ] || { [ -n "$LOCAL_CHANGED" ] && [ "$LOCAL_CHANGED" != "docker-compose.hetzner.yml" ]; }; then
              echo "::error::Unexpected modified tracked files on production. Refusing to overwrite."
              echo "::group::Modified tracked paths (no file contents)"
              git diff --name-only
              git diff --cached --name-only
              echo "::endgroup::"
              exit 1
            fi

            # This patch never leaves the server, never appears in logs and
            # is re-applied on top of the target commit before using Compose.
            COMPOSE_PATCH="$(mktemp)"
            chmod 600 "$COMPOSE_PATCH"
            VALIDATION_DB="hotelapp-migration-db-${DEPLOY_SHA:0:12}"
            VALIDATION_OLD_APP="hotelapp-compat-${DEPLOY_SHA:0:12}"
            VALIDATION_NETWORK="hotelapp-migration-${DEPLOY_SHA:0:12}"
            PREVIOUS_BACKEND_COMPAT_IMAGE=""
            cleanup() {
              docker rm -f "$VALIDATION_OLD_APP" "$VALIDATION_DB" >/dev/null 2>&1 || true
              docker network rm "$VALIDATION_NETWORK" >/dev/null 2>&1 || true
              if [ -n "$PREVIOUS_BACKEND_COMPAT_IMAGE" ]; then
                docker image rm "$PREVIOUS_BACKEND_COMPAT_IMAGE" >/dev/null 2>&1 || true
              fi
              rm -f "$COMPOSE_PATCH"
            }
            trap cleanup EXIT
            if [ "$LOCAL_CHANGED" = "docker-compose.hetzner.yml" ]; then
              git diff --binary -- docker-compose.hetzner.yml > "$COMPOSE_PATCH"
            fi
            git reset --hard "$DEPLOY_SHA"
            if [ -s "$COMPOSE_PATCH" ]; then
              if ! git apply --check "$COMPOSE_PATCH"; then
                echo "::error::Cannot safely reapply production Compose overrides; reverting code checkout."
                git reset --hard "$PREVIOUS_SHA"
                git apply "$COMPOSE_PATCH"
                exit 1
              fi
              git apply "$COMPOSE_PATCH"
              echo "Preserved server-specific Compose changes without logging contents"
            fi

            ACTUAL_SHA="$(git rev-parse HEAD)"
            if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
              echo "Expected $DEPLOY_SHA but server checked out $ACTUAL_SHA"
              exit 1
            fi

            BACKEND_CONTAINER="$(docker compose -f docker-compose.hetzner.yml ps -q backend)"
            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "Cannot back up production: the current backend container is not running"
              exit 1
            fi
            PREVIOUS_BACKEND_IMAGE_ID="$(docker inspect "$BACKEND_CONTAINER" --format '{{.Image}}')"
            PREVIOUS_BACKEND_COMPAT_IMAGE="hotelapp-backend-compat:${PREVIOUS_SHA:0:12}"
            docker image tag "$PREVIOUS_BACKEND_IMAGE_ID" "$PREVIOUS_BACKEND_COMPAT_IMAGE"

            BACKUP_DIR="$PWD/backups/$(date -u +%Y%m%dT%H%M%SZ)-$DEPLOY_SHA"
            install -m 700 -d "$BACKUP_DIR"
            DATABASE_URL="$(docker exec "$BACKEND_CONTAINER" printenv DATABASE_URL)"
            if [ -z "$DATABASE_URL" ]; then
              echo "Cannot back up production: DATABASE_URL is unavailable"
              exit 1
            fi
            # Prisma accepts the schema query parameter, but libpq/pg_dump does not.
            # Strip only that Prisma-only option for the backup client; keep the
            # original DATABASE_URL unchanged for the application and migrations.
            PG_DUMP_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's/\?schema=[^&]*&/?/; s/&schema=[^&]*//g; s/\?schema=[^&]*$//; s/[?&]$//')"
            if [ -z "$PG_DUMP_URL" ]; then
              echo "Cannot back up production: pg_dump connection URL is empty"
              exit 1
            fi
            docker run --rm --network charly-stack_default \
              -e DATABASE_URL="$DATABASE_URL" \
              -v "$BACKUP_DIR:/backup" \
              postgres:16-alpine \
              pg_dump --format=custom --no-owner --no-acl \
                --file=/backup/hotelapp.dump "$PG_DUMP_URL"
            test -s "$BACKUP_DIR/hotelapp.dump"

            DATA_VOLUME="$(docker inspect "$BACKEND_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
            EVIDENCE_VOLUME="$(docker inspect "$BACKEND_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/evidence"}}{{.Name}}{{end}}{{end}}')"
            test -n "$DATA_VOLUME"
            test -n "$EVIDENCE_VOLUME"
            docker run --rm -v "$DATA_VOLUME:/volume:ro" -v "$BACKUP_DIR:/backup" \
              alpine tar czf /backup/app-data.tgz -C /volume .
            docker run --rm -v "$EVIDENCE_VOLUME:/volume:ro" -v "$BACKUP_DIR:/backup" \
              alpine tar czf /backup/app-evidence.tgz -C /volume .
            test -s "$BACKUP_DIR/app-data.tgz"
            test -s "$BACKUP_DIR/app-evidence.tgz"
            printf '%s\n' "$PREVIOUS_SHA" > "$BACKUP_DIR/before-deploy-sha"
            chmod 600 "$BACKUP_DIR"/*
            echo "Production backup completed in $BACKUP_DIR"

            export GIT_SHA="$DEPLOY_SHA"
            docker compose -f docker-compose.hetzner.yml build --pull backend frontend
            BACKEND_IMAGE="$(docker compose -f docker-compose.hetzner.yml config --images | grep -- '-backend$' | head -n 1)"
            test -n "$BACKEND_IMAGE"

            # Restore the real production snapshot into an isolated PostgreSQL
            # container, migrate that copy, and prove that every pre-existing
            # device field is byte-for-byte equivalent afterwards.
            VALIDATION_PASSWORD="$(openssl rand -hex 32)"
            docker network create "$VALIDATION_NETWORK" >/dev/null
            docker run -d --name "$VALIDATION_DB" --network "$VALIDATION_NETWORK" \
              --network-alias postgres-snapshot \
              -e POSTGRES_PASSWORD="$VALIDATION_PASSWORD" \
              -e POSTGRES_DB=hotelapp_snapshot \
              -v "$BACKUP_DIR:/backup:ro" \
              postgres:16-alpine >/dev/null
            for i in $(seq 1 30); do
              if docker exec "$VALIDATION_DB" pg_isready -U postgres -d hotelapp_snapshot >/dev/null 2>&1; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::Snapshot PostgreSQL did not become ready"
                exit 1
              fi
              sleep 1
            done
            docker exec "$VALIDATION_DB" pg_restore --exit-on-error --no-owner --no-acl \
              -U postgres -d hotelapp_snapshot /backup/hotelapp.dump
            PRE_DEVICE_FINGERPRINT="$(docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
              -c "SELECT count(*)::text || ':' || md5(COALESCE(jsonb_agg(to_jsonb(d) - 'hardware_uid' ORDER BY id), '[]'::jsonb)::text) FROM devices d")"
            PRE_BOX1_FINGERPRINT="$(docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
              -c "SELECT count(*)::text || ':' || md5(COALESCE(jsonb_agg(to_jsonb(d) - 'hardware_uid' ORDER BY id), '[]'::jsonb)::text) FROM devices d WHERE device_id = 'checkoutbox-lab-01'")"
            if docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
              -c "SELECT to_regclass('public.device_discoveries') IS NOT NULL" | grep -qx t; then
              PRE_DISCOVERY_COUNT="$(docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
                -c "SELECT count(*) FROM device_discoveries")"
            else
              PRE_DISCOVERY_COUNT=0
            fi
            SNAPSHOT_DATABASE_URL="postgresql://postgres:${VALIDATION_PASSWORD}@postgres-snapshot:5432/hotelapp_snapshot?schema=public"
            docker run --rm --network "$VALIDATION_NETWORK" \
              -e DATABASE_URL="$SNAPSHOT_DATABASE_URL" \
              "$BACKEND_IMAGE" npx prisma migrate deploy --schema prisma/schema.prisma
            POST_DEVICE_FINGERPRINT="$(docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
              -c "SELECT count(*)::text || ':' || md5(COALESCE(jsonb_agg(to_jsonb(d) - 'hardware_uid' ORDER BY id), '[]'::jsonb)::text) FROM devices d")"
            POST_BOX1_FINGERPRINT="$(docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
              -c "SELECT count(*)::text || ':' || md5(COALESCE(jsonb_agg(to_jsonb(d) - 'hardware_uid' ORDER BY id), '[]'::jsonb)::text) FROM devices d WHERE device_id = 'checkoutbox-lab-01'")"
            test "$PRE_DEVICE_FINGERPRINT" = "$POST_DEVICE_FINGERPRINT"
            test "$PRE_BOX1_FINGERPRINT" = "$POST_BOX1_FINGERPRINT"
            POST_DISCOVERY_COUNT="$(docker exec "$VALIDATION_DB" psql -U postgres -d hotelapp_snapshot -At \
              -c "SELECT count(*) FROM device_discoveries")"
            test "$PRE_DISCOVERY_COUNT" = "$POST_DISCOVERY_COUNT"

            # The currently deployed (pre-change) backend must still start and
            # report healthy against the migrated snapshot. This establishes
            # the rollback path without touching the production database.
            docker run -d --name "$VALIDATION_OLD_APP" --network "$VALIDATION_NETWORK" \
              --env-file .env \
              -e DATABASE_URL="$SNAPSHOT_DATABASE_URL" \
              -e BACKEND_HOST=0.0.0.0 -e BACKEND_PORT=3001 \
              "$PREVIOUS_BACKEND_COMPAT_IMAGE" >/dev/null
            for i in $(seq 1 30); do
              if docker exec "$VALIDATION_OLD_APP" node -e \
                "fetch('http://127.0.0.1:3001/api/health').then(async r=>{const j=await r.json();process.exit(r.ok&&j.databaseConnected?0:1)}).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::Previous backend is not compatible with the migrated snapshot"
                docker logs --tail=100 "$VALIDATION_OLD_APP"
                exit 1
              fi
              sleep 2
            done
            docker rm -f "$VALIDATION_OLD_APP" "$VALIDATION_DB" >/dev/null
            docker network rm "$VALIDATION_NETWORK" >/dev/null
            unset VALIDATION_PASSWORD SNAPSHOT_DATABASE_URL
            echo "Real snapshot migration and backward-compatibility checks passed"

            docker compose -f docker-compose.hetzner.yml up -d --force-recreate --remove-orphans
            docker compose -f docker-compose.hetzner.yml ps

            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null && \
                 curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
                PROVISIONING_HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  -H 'Content-Type: application/json' -H 'X-Forwarded-Proto: https' -d '{}' \
                  http://127.0.0.1:3001/api/provisioning/v1/discover)"
                test "$PROVISIONING_HTTP_CODE" = 400
                FRONTEND_CONTAINER="$(docker compose -f docker-compose.hetzner.yml ps -q frontend)"
                test -n "$FRONTEND_CONTAINER"
                docker exec "$FRONTEND_CONTAINER" grep -R -q "Nuevo dispositivo detectado" /srv
                echo "Services are healthy"
                echo "Provisioning endpoint fails invalid discovery safely and the admin panel is present"
                echo "Deployed commit: $ACTUAL_SHA"
                exit 0
              fi
              echo "Waiting for services to be ready... (attempt $i/30)"
              sleep 2
            done

            echo "Services failed to become healthy"
            docker compose -f docker-compose.hetzner.yml ps
            docker compose -f docker-compose.hetzner.yml logs --tail=100 backend frontend
            echo "Rolling application code back to $PREVIOUS_SHA"
            git reset --hard "$PREVIOUS_SHA"
            if [ -s "$COMPOSE_PATCH" ]; then
              git apply "$COMPOSE_PATCH"
            fi
            export GIT_SHA="$PREVIOUS_SHA"
            docker compose -f docker-compose.hetzner.yml build backend frontend
            docker compose -f docker-compose.hetzner.yml up -d --force-recreate --remove-orphans
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null && \
                 curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
                echo "Rollback restored healthy services at $PREVIOUS_SHA"
                exit 1
              fi
              sleep 2
            done
            echo "::error::Automatic application rollback also failed; backups remain in $BACKUP_DIR"
            exit 1
          EOF

      - name: Verify deployed commit
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
            set -euo pipefail

            BACKEND_JSON="$(curl --fail --silent --show-error http://127.0.0.1:3001/api/version)"
            FRONTEND_JSON="$(curl --fail --silent --show-error http://127.0.0.1:3000/version.json)"

            BACKEND_SHA="$(printf '%s' "$BACKEND_JSON" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            FRONTEND_SHA="$(printf '%s' "$FRONTEND_JSON" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"

            if [ -z "$BACKEND_SHA" ]; then
              echo "Backend SHA verification failed: could not extract sha from /api/version response"
              echo "$BACKEND_JSON"
              exit 1
            fi

            if [ -z "$FRONTEND_SHA" ]; then
              echo "Frontend SHA verification failed: could not extract sha from /version.json response"
              echo "$FRONTEND_JSON"
              exit 1
            fi

            if [ "$BACKEND_SHA" != "$DEPLOY_SHA" ]; then
              echo "Backend SHA mismatch: expected $DEPLOY_SHA but /api/version returned $BACKEND_SHA"
              exit 1
            fi

            if [ "$FRONTEND_SHA" != "$DEPLOY_SHA" ]; then
              echo "Frontend SHA mismatch: expected $DEPLOY_SHA but /version.json returned $FRONTEND_SHA"
              exit 1
            fi

            echo "Backend and frontend expose deployed commit $DEPLOY_SHA"
          EOF
