name: Deploy HotelApp to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotelapp-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://hotelapp:dummy@localhost:5432/hotelapp
        run: npx prisma validate

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy exact commit
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
            set -euo pipefail
            cd /opt/hotelapp

            git fetch --prune origin main
            git reset --hard "$DEPLOY_SHA"

            ACTUAL_SHA="$(git rev-parse HEAD)"
            if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
              echo "Expected $DEPLOY_SHA but server checked out $ACTUAL_SHA"
              exit 1
            fi

            BACKEND_CONTAINER="$(docker compose -f docker-compose.hetzner.yml ps -q backend)"
            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "Cannot back up production: the current backend container is not running"
              exit 1
            fi

            BACKUP_DIR="$PWD/backups/$(date -u +%Y%m%dT%H%M%SZ)-$DEPLOY_SHA"
            install -m 700 -d "$BACKUP_DIR"
            DATABASE_URL="$(docker exec "$BACKEND_CONTAINER" printenv DATABASE_URL)"
            if [ -z "$DATABASE_URL" ]; then
              echo "Cannot back up production: DATABASE_URL is unavailable"
              exit 1
            fi
            # Prisma accepts the schema query parameter, but libpq/pg_dump does not.
            # Strip only that Prisma-only option for the backup client; keep the
            # original DATABASE_URL unchanged for the application and migrations.
            PG_DUMP_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's/\?schema=[^&]*&/?/; s/&schema=[^&]*//g; s/\?schema=[^&]*$//; s/[?&]$//')"
            if [ -z "$PG_DUMP_URL" ]; then
              echo "Cannot back up production: pg_dump connection URL is empty"
              exit 1
            fi
            docker run --rm --network charly-stack_default \
              -e DATABASE_URL="$DATABASE_URL" \
              -v "$BACKUP_DIR:/backup" \
              postgres:16-alpine \
              pg_dump --format=custom --no-owner --no-acl \
                --file=/backup/hotelapp.dump "$PG_DUMP_URL"
            test -s "$BACKUP_DIR/hotelapp.dump"

            DATA_VOLUME="$(docker inspect "$BACKEND_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
            EVIDENCE_VOLUME="$(docker inspect "$BACKEND_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/evidence"}}{{.Name}}{{end}}{{end}}')"
            test -n "$DATA_VOLUME"
            test -n "$EVIDENCE_VOLUME"
            docker run --rm -v "$DATA_VOLUME:/volume:ro" -v "$BACKUP_DIR:/backup" \
              alpine tar czf /backup/app-data.tgz -C /volume .
            docker run --rm -v "$EVIDENCE_VOLUME:/volume:ro" -v "$BACKUP_DIR:/backup" \
              alpine tar czf /backup/app-evidence.tgz -C /volume .
            test -s "$BACKUP_DIR/app-data.tgz"
            test -s "$BACKUP_DIR/app-evidence.tgz"
            printf '%s\n' "$DEPLOY_SHA" > "$BACKUP_DIR/before-deploy-sha"
            chmod 600 "$BACKUP_DIR"/*
            echo "Production backup completed in $BACKUP_DIR"

            export GIT_SHA="$DEPLOY_SHA"
            docker compose -f docker-compose.hetzner.yml build --pull backend frontend
            docker compose -f docker-compose.hetzner.yml up -d --force-recreate --remove-orphans
            docker compose -f docker-compose.hetzner.yml ps

            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null && \
                 curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
                echo "Services are healthy"
                echo "Deployed commit: $ACTUAL_SHA"
                exit 0
              fi
              echo "Waiting for services to be ready... (attempt $i/30)"
              sleep 2
            done

            echo "Services failed to become healthy"
            docker compose -f docker-compose.hetzner.yml ps
            docker compose -f docker-compose.hetzner.yml logs --tail=100 backend frontend
            exit 1
          EOF

      - name: Verify deployed commit
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
            set -euo pipefail

            BACKEND_JSON="$(curl --fail --silent --show-error http://127.0.0.1:3001/api/version)"
            FRONTEND_JSON="$(curl --fail --silent --show-error http://127.0.0.1:3000/version.json)"

            BACKEND_SHA="$(printf '%s' "$BACKEND_JSON" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            FRONTEND_SHA="$(printf '%s' "$FRONTEND_JSON" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"

            if [ -z "$BACKEND_SHA" ]; then
              echo "Backend SHA verification failed: could not extract sha from /api/version response"
              echo "$BACKEND_JSON"
              exit 1
            fi

            if [ -z "$FRONTEND_SHA" ]; then
              echo "Frontend SHA verification failed: could not extract sha from /version.json response"
              echo "$FRONTEND_JSON"
              exit 1
            fi

            if [ "$BACKEND_SHA" != "$DEPLOY_SHA" ]; then
              echo "Backend SHA mismatch: expected $DEPLOY_SHA but /api/version returned $BACKEND_SHA"
              exit 1
            fi

            if [ "$FRONTEND_SHA" != "$DEPLOY_SHA" ]; then
              echo "Frontend SHA mismatch: expected $DEPLOY_SHA but /version.json returned $FRONTEND_SHA"
              exit 1
            fi

            echo "Backend and frontend expose deployed commit $DEPLOY_SHA"
          EOF
