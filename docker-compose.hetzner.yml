services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
      APP_DOMAIN: ${APP_DOMAIN:-hotelapp.charlydob.com}
      APP_ORIGIN: ${APP_ORIGIN:-https://hotelapp.charlydob.com}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hotelapp_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3001
      OTA_PUBLIC_ORIGIN: ${APP_ORIGIN:-https://hotelapp.charlydob.com}
      # Backend is private; the existing Caddy proxy supplies X-Forwarded-Proto.
      OTA_TRUST_PROXY: "true"
      FIRMWARE_DIR: /data/firmware
      DATA_DIR: /data
      EVIDENCE_DIR: /evidence
      FRIGATE_BASE_URL: ${FRIGATE_BASE_URL:-http://frigate:5000}
      RESERVATION_CACHE_SECONDS: ${RESERVATION_CACHE_SECONDS:-30}
      CHECKOUT_COOLDOWN_SECONDS: ${CHECKOUT_COOLDOWN_SECONDS:-120}
      PUBLIC_CHECKOUT_RATE_LIMIT: ${PUBLIC_CHECKOUT_RATE_LIMIT:-30}
      PUBLIC_CHECKOUT_RATE_WINDOW_MS: ${PUBLIC_CHECKOUT_RATE_WINDOW_MS:-60000}
      N8N_CHECKOUT_WEBHOOK_URL: ${N8N_CHECKOUT_WEBHOOK_URL:-}
      N8N_CHECKOUT_WEBHOOK_SECRET: ${N8N_CHECKOUT_WEBHOOK_SECRET:-}
      MATCH_TIME_WINDOW_MINUTES: ${MATCH_TIME_WINDOW_MINUTES:-15}
      MATCH_AUTO_CONFIDENCE_THRESHOLD: ${MATCH_AUTO_CONFIDENCE_THRESHOLD:-0.8}
      PLATE_COOLDOWN_MINUTES: ${PLATE_COOLDOWN_MINUTES:-15}
      PLATE_PRESENCE_TIMEOUT_MINUTES: ${PLATE_PRESENCE_TIMEOUT_MINUTES:-30}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - app-data:/data
      - app-evidence:/evidence
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - charly-stack_default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.hetzner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - charly-stack_default

networks:
  charly-stack_default:
    external: true
    name: charly-stack_default

volumes:
  app-data:
  app-evidence:
